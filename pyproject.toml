[project]
name = "amadeus-sqlsmith"
version = "0.1.0"
description = "AgentBeats A2A purple agent specialized for Text-to-SQL tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "openai>=2.0.0",
    "sqlglot>=26.0.0",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
